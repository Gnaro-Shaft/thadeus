[project]
name = "thadeus"
version = "0.1.0"
description = "Thadeus — LLM entraîné from scratch, du corpus au modèle"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.6",
    "numpy>=2.0",
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thadeus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
