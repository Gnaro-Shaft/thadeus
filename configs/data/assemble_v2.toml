# Assemblage v2 — intègre les deux collectes obtenues APRÈS le correctif de graine.
#
# Les collectes daily_20260809 à 20260813 sont volontairement ABSENTES : elles
# recouvrent `extend_fr` à 98,8 % (graine de source figée à 7331, voir le commit
# « La graine des sources ne dérivait pas de celle du corpus »). Les inclure
# n'ajouterait rien et ferait travailler la déduplication pour rien.
#
# **Le français passe de 65 % à 82 %.** Ce n'est pas un renoncement sur le code :
# en valeur absolue il progresse (840 M contre 612 M dans thadeus_v1), tout comme
# l'anglais (777 M contre 763 M). Seule la proportion baisse, parce que le
# français est la seule dimension où l'on a pu collecter davantage — et c'est
# aussi la faiblesse mesurée du modèle : perplexité 24-27 sur la prose française
# contre 4,5 sur le code.
#
# Les poids reproduisent les volumes réellement disponibles, pour que le plan de
# mélange n'ait aucun déficit à signaler.

extends = "data/fr_first.toml"

label = "thadeus_v2"
total_tokens = 9_215_000_000

