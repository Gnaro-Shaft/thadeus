# Run de référence sur le modèle de 80,7 M.

label = "small"
seed = 1337
device = "auto"
compile = true              # x3,00 mesuré sur MPS en Phase 3

model_config_path = "model/small.toml"
tokens_label = "fr_first"

# Lot effectif = batch_size x grad_accum x seq_len = 12 x 8 x 1024 ≈ 98 k tokens.
# C'est le lot effectif qui gouverne la stabilité, pas batch_size seul.
batch_size = 12
grad_accum = 8
total_steps = 20_000        # ≈ 2 Md tokens

log_every = 20
checkpoint_every = 500
keep_last = 2
sample_every = 1_000
sample_prompt = "Le principe fondamental de"

[optim]
name = "adamw"
lr = 3e-4
weight_decay = 0.1
betas = [0.9, 0.95]
grad_clip = 1.0

# WSD plutôt que cosinus : on peut arrêter le palier quand on veut et ne payer
# que la décroissance. Décisif quand le budget H100 est encore inconnu.
[optim.schedule]
name = "wsd"
warmup_steps = 200
decay_fraction = 0.1

[eval]
every = 500
batches = 20
val_tokens = 5_000_000
