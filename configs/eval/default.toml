# Campagne d'évaluation de référence.

label = "eval"
seed = 1337
device = "auto"

run_label = "medium_mup"          # d'où vient le checkpoint
model_config_path = "model/medium.toml"
tokenizer_label = "bpe32k"

# Le corpus d'évaluation est FIGÉ ici, et ce n'est pas cosmétique : deux
# évaluations portant sur des documents différents ne se comparent pas, même
# quand leurs colonnes se ressemblent. Laissé sur `fr_first_v2` alors que le
# run de référence utilisait `thadeus_v1`, ce réglage a produit une perplexité
# de 30,98 face à 22,70 — un écart entièrement dû au changement de corpus.
corpus_label = "thadeus_v1"
max_documents = 400
seq_len = 1024

# Les 18 romans du domaine public. Ils ne pèsent presque rien dans le corpus
# (0,08 %) mais font le meilleur juge du français qu'on ait : littéraire,
# cohérent, sans balisage — le contraire d'une page web.
gutenberg_root = "${THADEUS_GUTENBERG:-}"
gutenberg_documents = 200

probes = true
generate = true
max_new_tokens = 60
